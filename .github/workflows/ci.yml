name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Only first-party actions here, so CI does not break when a third-party
      # action bumps its major. Locally the project uses uv; pip installs the
      # same package from the same pyproject.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy

      # A Skill declaring an input perception cannot produce reads perfectly in
      # review and then never fires. Only a machine check catches that.
      - name: Validate Skills registry
        run: printpilot skills validate

      # No API key is configured for CI on purpose: the core suite must pass
      # offline via MockLLMClient. If a test ever needs a live model, it belongs
      # behind an explicit opt-in marker, not in this job.
      - name: Test
        run: pytest
