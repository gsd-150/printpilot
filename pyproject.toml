[project]
name = "printpilot"
version = "0.1.0"
description = "FDM 打印过程异常诊断与安全动作决策系统（合成遥测环境，非实机控制）"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Yucheng Tang" }]
keywords = ["llm", "agent", "langgraph", "rag", "fdm", "3d-printing"]

dependencies = [
    "pydantic>=2.9,<3",
    # Pinned below 2.x on purpose: this is orchestration infrastructure and its
    # API has churned across majors. See docs/decisions/0001-agent-framework.md.
    "langgraph>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
printpilot = "printpilot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/printpilot"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Ruff >=0.16 also formats fenced code blocks inside Markdown. The planning docs
# contain illustrative snippets that are not meant to compile, so keep them out.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "ANN",  # type annotations
    "PTH",  # use pathlib
]
ignore = [
    "ANN401",  # allow typing.Any where genuinely needed
    "RUF001",  # ambiguous unicode in strings: this project is bilingual by design
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN201", "ANN001"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
show_error_codes = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=printpilot --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["src/printpilot"]

[tool.coverage.report]
exclude_also = [
    '^\s*\.\.\.$',          # Protocol / stub bodies
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
